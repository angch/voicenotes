name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.5.3)'
        required: false
        default: 'v0.5.3'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Dependencies
        run: |
          uv sync --all-groups --all-extras

      - name: Start Windows Audio Service
        shell: pwsh
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue

      - name: Pre-download Offline Models for Packaging
        run: |
          uv run -- python build_executable.py --models tiny,base,diarization --skip-pyinstaller

      - name: Run Test Suite
        run: |
          uv run -- python -m pytest -v --tb=short

      - name: Build Standalone Executable
        run: |
          uv run -- python build_executable.py --models tiny,base,diarization

      - name: Determine Version
        id: version_info
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver -or $ver.StartsWith("refs/") -or $ver -eq "main") {
            $ver = "${{ github.event.inputs.tag_name }}"
            if (-not $ver) { $ver = "v0.5.3" }
          }
          $cleanVer = $ver.TrimStart('v')
          Write-Host "Resolved release tag: $ver (clean version: $cleanVer)"
          "tag=$ver" >> $env:GITHUB_OUTPUT
          "clean_version=$cleanVer" >> $env:GITHUB_OUTPUT

      - name: Compile Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          Write-Host "Compiling installer using ISCC: $iscc"
          & $iscc VoiceNotes.iss /DMyAppVersion=${{ steps.version_info.outputs.clean_version }}

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          $zipPath = "dist-installer\VoiceNotes-${{ steps.version_info.outputs.tag }}-windows-x64-portable.zip"
          Compress-Archive -Path dist\VoiceNotes\* -DestinationPath $zipPath -Force
          Get-ChildItem dist-installer

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist-installer/VoiceNotes-Setup-*.exe
            dist-installer/VoiceNotes-*-portable.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS Application & DMG
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --all-groups

      - name: Pre-download Offline Models for Packaging
        run: |
          uv run -- python build_executable.py --models tiny,base,diarization --skip-pyinstaller

      - name: Run Test Suite
        run: |
          uv run -- python -m pytest -v --tb=short

      - name: Build Standalone macOS App & DMG
        run: |
          uv run -- python build_executable.py --models tiny,base,diarization

      - name: Determine Version
        id: version_info
        run: |
          ver="${{ github.ref_name }}"
          if [ -z "$ver" ] || [[ "$ver" == refs/* ]] || [ "$ver" = "main" ]; then
            ver="${{ github.event.inputs.tag_name }}"
            if [ -z "$ver" ]; then ver="v0.5.3"; fi
          fi
          cleanVer="${ver#v}"
          echo "tag=$ver" >> $GITHUB_OUTPUT
          echo "clean_version=$cleanVer" >> $GITHUB_OUTPUT

      - name: Package macOS Artifacts
        run: |
          mkdir -p dist-installer
          cp dist/VoiceNotes.dmg "dist-installer/VoiceNotes-${{ steps.version_info.outputs.tag }}-macos.dmg"
          cd dist && zip -r "../dist-installer/VoiceNotes-${{ steps.version_info.outputs.tag }}-macos-app.zip" VoiceNotes.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist-installer/VoiceNotes-*-macos.dmg
            dist-installer/VoiceNotes-*-macos-app.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux Application & Debian (.deb) Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libportaudio2 libxcb-cursor0 libpulse0 dpkg-dev

      - name: Install Dependencies
        run: |
          uv sync --all-groups

      - name: Pre-download Offline Models for Packaging
        run: |
          uv run -- python build_executable.py --models tiny,base,diarization --skip-pyinstaller

      - name: Run Test Suite (Headless Display)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -s "-screen 0 1280x1024x24" uv run -- python -m pytest -v --tb=short

      - name: Determine Version
        id: version_info
        run: |
          ver="${{ github.ref_name }}"
          if [ -z "$ver" ] || [[ "$ver" == refs/* ]] || [ "$ver" = "main" ]; then
            ver="${{ github.event.inputs.tag_name }}"
            if [ -z "$ver" ]; then ver="v0.5.3"; fi
          fi
          cleanVer="${ver#v}"
          echo "tag=$ver" >> $GITHUB_OUTPUT
          echo "clean_version=$cleanVer" >> $GITHUB_OUTPUT

      - name: Build Standalone Executable
        run: |
          uv run -- python build_executable.py --models tiny,base,diarization

      - name: Generate Debian Packages (.deb)
        run: |
          uv run -- python scripts/build_deb.py --mode both --version ${{ steps.version_info.outputs.clean_version }}

      - name: Package Linux Artifacts
        run: |
          mkdir -p dist-installer
          cp dist/*.deb dist-installer/
          tar -czf "dist-installer/VoiceNotes-${{ steps.version_info.outputs.tag }}-linux-x64-portable.tar.gz" -C dist VoiceNotes
          ls -la dist-installer/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist-installer/*.deb
            dist-installer/VoiceNotes-*-linux-x64-portable.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish Multiplatform Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version_info
        run: |
          ver="${{ github.ref_name }}"
          if [ -z "$ver" ] || [[ "$ver" == refs/* ]] || [ "$ver" = "main" ]; then
            ver="${{ github.event.inputs.tag_name }}"
            if [ -z "$ver" ]; then ver="v0.5.3"; fi
          fi
          echo "tag=$ver" >> $GITHUB_OUTPUT

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: VoiceNotes ${{ steps.version_info.outputs.tag }}
          files: |
            release-assets/*
            release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
