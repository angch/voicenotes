[project]
name = "voicenotes"
version = "0.1.0"
description = "Multiplatform offline speech transcriber with speaker diarization - Notepad Lite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av==14.2.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.0.0",
    "pyinstaller>=6.22.3",
    "pyqt6>=6.11.0",
    "scikit-learn>=1.5.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
]

[project.scripts]
voicenotes = "voicenotes.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["voicenotes*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
